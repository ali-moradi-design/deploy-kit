# __DOMAIN__ -> the app's web container on 127.0.0.1:__PORT__.
# Fill the placeholders (dynamic/README.md, step 5), save as
# /etc/nginx/sites-available/__NAME__, symlink into sites-enabled,
# `nginx -t`, `systemctl reload nginx`. certbot --nginx then adds the TLS
# block; edit the live file by hand after that.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 2m; # raise only for apps with uploads

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # always overwrite: visitors cannot choose their own IP (rate limits)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (Socket.IO, Next.js dev tools) need the upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
