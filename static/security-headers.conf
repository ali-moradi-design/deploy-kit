# Shared security headers for every static site. Install once as
# /etc/nginx/snippets/static-security-headers.conf.
# Nginx drops server-level add_header lines inside any location that has its
# own add_header, so every location includes this file.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Only what a <meta> CSP cannot do; a site may add its own CSP in its pages.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
