# __DOMAIN__: plain static files in /srv/static/__NAME__ (copied by the
# deploy-static workflow). No app server and no database behind it, so the
# web server stays a read-only file server.
#
# Fill the placeholders (static/README.md, step 5), save as
# /etc/nginx/sites-available/__NAME__, symlink into sites-enabled,
# `nginx -t`, `systemctl reload nginx`. certbot --nginx then copies this
# block into a TLS block; edit the live file by hand after that.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /srv/static/__NAME__;
    index index.html;
    server_tokens off;            # do not advertise the Nginx version
    client_max_body_size 1k;      # nothing is ever uploaded here
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Only reading: POST/PUT/DELETE... get 405.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Hidden files (.git, .env...) never get served.
    location ~ /\. { deny all; }

    # Hashed build files: cache for a year. Next.js writes them to
    # /_next/static/, Vite to /assets/ (change the path for a Vite site).
    location /_next/static/ {
        include snippets/static-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 3D models and textures (unhashed names, so 30 days, not immutable).
    location ~* \.(glb|ktx2|usdz)$ {
        types {
            model/gltf-binary glb;
            image/ktx2 ktx2;
            model/vnd.usdz+zip usdz;    # iOS AR Quick Look
        }
        include snippets/static-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        include snippets/static-security-headers.conf;
        # Next.js export: /about -> about.html. For a Vite single-page app
        # use `try_files $uri $uri/ /index.html;` instead.
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
