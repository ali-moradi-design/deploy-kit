name: Deploy app

# Reusable workflow: tells the VPS to run a dynamic app (Docker Compose) with
# new images. The images are built and pushed by the calling repo first
# (dynamic/caller.yml), because every app builds differently.
#
# What the calling repo needs (dynamic/README.md has the full checklist):
# - a GitHub environment (default "production") with
#   vars SSH_HOST, SSH_PORT, SSH_USER and secrets SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS
# - `secrets: inherit` on the calling job: without it the deploy job does not
#   get the environment's secrets, although it runs in that environment
# - on the server, that key is forced to `deploy-app <name>` (server/deploy-app):
#   it only accepts an image tag, so this workflow never needs the app name.
on:
  workflow_call:
    inputs:
      image-tag:
        description: Full commit SHA the images are tagged with
        type: string
        required: true
      site-url:
        description: Public URL of the app, e.g. https://shop-books.ali-moradi-develop.com
        type: string
        required: true
      smoke-paths:
        description: Paths that must answer 200 after the deploy (separated by spaces)
        type: string
        default: /
      environment:
        description: GitHub environment that holds the SSH settings
        type: string
        default: production

permissions: {}

jobs:
  deploy:
    name: Deploy to the VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never cancel a running deploy; queue the next one.
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.site-url }}
    steps:
      - name: Check the tag
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image-tag must be a full commit SHA"; exit 1; }
      - name: SSH key and known host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_PRIVATE_KEY or SSH_KNOWN_HOSTS is empty: is the environment right, and does the caller use secrets: inherit?"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The server runs deploy-app: pull, up --wait, and roll back by itself
      # when the new containers do not become healthy.
      - name: Pull the new images and restart
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: >-
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes
          "$SSH_USER@$SSH_HOST" "$IMAGE_TAG"
      - name: Smoke test through Nginx
        env:
          SITE_URL: ${{ inputs.site-url }}
          SMOKE_PATHS: ${{ inputs.smoke-paths }}
        run: |
          set -f # no glob expansion in the path list
          for path in $SMOKE_PATHS; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 5 --retry-delay 5 --retry-all-errors "${SITE_URL%/}$path"
            echo "ok $path"
          done
      - if: always()
        run: rm -f ~/.ssh/deploy_key
